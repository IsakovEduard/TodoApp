version: '3.8'

services:
  todo-app:
    build: .
    container_name: todo-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (min 32 characters)}
    volumes:
      - h2-data:/app/data   # Mounts the volume to /app/data

volumes:
  h2-data:                 # Named volume